stages:
  - policy
  - static
  - test
  - security
  - build
  - acceptance
  - release

flow:doctor:
  stage: policy
  script:
    - python3 scripts/codex-flow.py doctor
    - python3 scripts/codex-flow.py status

project:static:
  stage: static
  script:
    - ./scripts/project-check static

project:test:
  stage: test
  script:
    - ./scripts/project-check test

project:security:
  stage: security
  script:
    - ./scripts/project-check security

project:build:
  stage: build
  script:
    - ./scripts/project-check build
  artifacts:
    paths:
      - artifacts/

project:acceptance:
  stage: acceptance
  script:
    - ./scripts/project-check acceptance
  artifacts:
    when: always
    paths:
      - artifacts/runtime/

flow:release:
  stage: release
  script:
    - python3 scripts/codex-flow.py check release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

