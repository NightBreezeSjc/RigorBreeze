name: production-flow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check workflow state
        run: python3 scripts/codex-flow.py doctor
      - name: Static checks
        run: ./scripts/project-check static
      - name: Tests
        run: ./scripts/project-check test
      - name: Security and supply chain
        run: ./scripts/project-check security
      - name: Build immutable artifact
        run: ./scripts/project-check build
      - name: Runtime acceptance
        run: ./scripts/project-check acceptance
      - name: Release gate
        run: python3 scripts/codex-flow.py check release

