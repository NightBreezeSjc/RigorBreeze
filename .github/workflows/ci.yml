name: Skill CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run workflow tests
        run: python -m unittest discover -s rigorbreeze/scripts/tests -v
      - name: Compile runner
        run: python -m py_compile rigorbreeze/scripts/flow.py rigorbreeze/scripts/flow_state.py rigorbreeze/scripts/flow_parallel.py rigorbreeze/scripts/flow_automation.py rigorbreeze/scripts/flow_policy.py rigorbreeze/scripts/flow_records.py rigorbreeze/scripts/flow_verification.py rigorbreeze/scripts/flow_diagnostics.py

  skill-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify public Skill contract
        run: python -m unittest discover -s rigorbreeze/scripts/tests -p test_skill_contract.py -v
      - name: Validate Agent behavior contracts
        run: python tests/behavior/run.py validate
      - name: Test deterministic Agent behavior scorer
        run: python -m unittest discover -s tests/behavior -v
      - name: Validate POSIX hooks
        run: sh -n rigorbreeze/assets/hooks/pre-commit
